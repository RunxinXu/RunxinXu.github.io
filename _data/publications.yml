# Selected publications, newest first.
#
# To add a paper, copy one block. Fields:
#   title   — the paper title (plain text)
#   authors — author list; wrap your own name in <strong>…</strong>
#   venue   — short venue + year, shown in the left column (keep it short)
#   note    — optional small tag under the authors (e.g. "Cover Article")
#   links   — optional list of { name, url }
#   figure  — optional teaser image, e.g. /img/pubs/deepseek-r1.png
#   alt     — optional alt text for that image (defaults to the title)
#
# The figure column only appears once at least one entry has a `figure:`.
# `tools/pub-figures.py` can pull candidate figures straight out of the arXiv PDFs.

